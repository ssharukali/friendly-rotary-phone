name: Dependency Checker

on: 
  push:
    branches: [main]

jobs: 
  job1:
    name: JOB1-
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 - checkout
        uses: actions/checkout@v7.0.0
      - name: step-3
        run: | 

          echo `pwd` >> myfile.txt
          ls -ltr
          hostname
      - name: upload single file
        uses: actions/upload-artifact@v3
        with:
          name: myfile.txt
          path: ./myfile.txt
