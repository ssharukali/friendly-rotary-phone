name: Dependency Checker

on: 
  push:
    branches: [main]

jobs: 
  job1:
    name: JOB1-
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 - checkout
        uses: actions/checkout@v7.0.0
      - name: step-3
        run: | 

          echo `pwd` >> myfile.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/lists.txt
          echo `hostname` >> artifacts/hostname.txt
          hostname
      - name: single_file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: myfile.txt
          path: ./myfile.txt
      - name: upload artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: artifacts_directory
          path: ./artifacts
      - name: upload via multiple paths
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple_paths
          path: |
            ./myfile.txt
            ./artifacts
      - name: upload via multiple paths with exclusions
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple_paths_with_exclusions
          path: |
            ./myfile.txt
            ./artifacts/lists.txt
            !**/hostname.txt
  job2:
    name: job2
    runs-on: ubuntu-latest
    steps:
      - name: checking out artifacts_directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with: 
          name: single_file
      - name: checking dir post download
        run : |
          pwd
          ls -ltr