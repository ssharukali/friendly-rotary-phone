name: Dependency Checker

on:
  push:
    branches:
      - main

jobs:
  job1:
    name: Job1 - Create Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Initial Workspace Check
        run: |
          pwd
          ls -ltr
          hostname

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Files
        run: |
          echo "$(pwd)" > myfile.txt

          mkdir -p artifacts

          ls -ltr > artifacts/lists.txt
          hostname > artifacts/hostname.txt

      - name: Verify Created Files
        run: |
          ls -R

      - name: Upload Single File
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: myfile.txt

      - name: Upload Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts_directory
          path: artifacts/

      - name: Upload Multiple Paths
        uses: actions/upload-artifact@v4
        with:
          name: multiple_paths
          path: |
            myfile.txt
            artifacts/

      - name: Upload Multiple Paths With Exclusions
        uses: actions/upload-artifact@v4
        with:
          name: multiple_paths_with_exclusions
          path: |
            myfile.txt
            artifacts/lists.txt
            !**/hostname.txt

  job2:
    name: Job2 - Download Artifacts
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Pre-Download Check
        run: |
          pwd
          ls -ltr

      - name: Download Single File Artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file

      - name: Verify Downloaded Files
        run: |
          echo "Downloaded contents:"
          ls -R

          echo "Contents of myfile.txt:"
          cat myfile.txt

  job3: 
    name: Job3 - Download Directory Artifact
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Pre-Download Check
        run: |
          pwd
          ls -ltr

      - name: Download Directory Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts_directory

      - name: Verify Downloaded Directory
        run: |
          echo "Downloaded contents:"
          ls 
  job4:
    name: Job4
    needs: job1
    runs-on: ubuntu-latest
    steps:
        - name: Creating directories
          run: |
            mkdir -p single_file
            mkdir -p download_dir
        - name: Pre-Download Check
          run: |
            pwd
            ls -ltr
        - name: Download single file Artifact
          uses: actions/download-artifact@v4
          with:
            name: myfile.txt
            path: single_file
        - name: Download directory Artifact
          uses: actions/download-artifact@v4
          with:
            name: artifacts_directory
            path: download_dir
        - name: Verify Downloaded Multiple Paths
          run: |
            echo "Downloaded contents:"
            ls -ltr single_file
            ls -ltr download_dir

  













